<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients — PharmaMS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav>
    <a href="/" class="brand">💊 PharmaMS <span>B2B</span></a>
    <a href="/medicines.html" class="nav-link">Medicines</a>
    <a href="/patients.html" class="nav-link active">Patients</a>
    <a href="/prescriptions.html" class="nav-link">Prescriptions</a>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <h1>Patients</h1>
        <p>Manage registered patient records</p>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date of Birth</th>
            <th>Phone</th>
            <th>Email</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="patients-table">
          <tr><td colspan="6" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="form-card">
      <h2>Register New Patient</h2>
      <div id="msg" class="msg"></div>
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input id="name" type="text" placeholder="e.g. John Doe" />
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input id="date_of_birth" type="date" />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input id="phone" type="text" placeholder="e.g. +35799123456" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input id="email" type="email" placeholder="e.g. john@example.com" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="createPatient()">Register Patient</button>
      </div>
    </div>
  </div>

  <script>
    async function loadPatients() {
      const res  = await fetch('/patients');
      const data = await res.json();
      const tbody = document.getElementById('patients-table');

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">No patients found. Register one below.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(p => `
        <tr>
          <td style="color:var(--muted);font-size:13px">#${p.id}</td>
          <td><strong>${p.name}</strong></td>
          <td>${p.date_of_birth}</td>
          <td>${p.phone}</td>
          <td>${p.email}</td>
          <td><button class="btn btn-danger" onclick="deletePatient(${p.id})">Delete</button></td>
        </tr>
      `).join('');
    }

    async function createPatient() {
      const msg = document.getElementById('msg');
      const body = {
        name:          document.getElementById('name').value,
        date_of_birth: document.getElementById('date_of_birth').value,
        phone:         document.getElementById('phone').value,
        email:         document.getElementById('email').value,
      };

      const res = await fetch('/patients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (res.ok) {
        msg.className = 'msg success';
        msg.textContent = 'Patient registered successfully.';
        ['name','date_of_birth','phone','email'].forEach(id => document.getElementById(id).value = '');
        loadPatients();
      } else {
        msg.className = 'msg error';
        msg.textContent = 'Failed to register patient. Please fill in all fields.';
      }
    }

    async function deletePatient(id) {
      if (!confirm('Soft delete this patient?')) return;
      await fetch(`/patients/${id}`, { method: 'DELETE' });
      loadPatients();
    }

    loadPatients();
  </script>
</body>
</html>
